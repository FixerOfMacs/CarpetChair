name: Compile iOS App (.ipa)
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test the Jabber engine (XMPPCore)
        run: |
          if [ -d Packages/XMPPCore/Tests ]; then
            swift test --package-path Packages/XMPPCore
          else
            echo "No engine tests in this upload yet; skipping."
          fi

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build CarpetChair.app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -quiet \
            -project CarpetChair.xcodeproj -scheme CarpetChair \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/CarpetChair.app
          test -f "$APP/Info.plist" && test -f "$APP/SmileyTable.plist" && test -f "$APP/smile.tif"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../CarpetChair.ipa Payload)
          ls -la CarpetChair.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: CarpetChair-ipa
          path: CarpetChair.ipa
