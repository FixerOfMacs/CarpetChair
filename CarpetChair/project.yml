# XcodeGen spec. The workflow runs `xcodegen generate` to turn this into CarpetChair.xcodeproj,
# so the project file itself is never committed (see .gitignore). On a Mac you can do the same:
#   brew install xcodegen && xcodegen generate && open CarpetChair.xcodeproj
name: CarpetChair
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
packages:
  XMPPCore:
    path: Packages/XMPPCore
targets:
  CarpetChair:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CarpetChair
    dependencies:
      - package: XMPPCore
    scheme: {}
    info:
      path: CarpetChair/Info.plist
      properties:
        CFBundleDisplayName: CarpetChair
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fixerofmacs.CarpetChair
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
